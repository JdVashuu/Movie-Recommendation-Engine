[project]
name = "movie-recomend"
version = "0.1.0"
description = "Reinforcement Learning-based Movie Recommendation System with Multi-Armed Bandits and Dueling DQN"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "torch",
    "scikit-learn",
    "pydantic>=2.13.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

